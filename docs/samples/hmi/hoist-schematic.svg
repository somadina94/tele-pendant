<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Hoist schematic">
  <rect width="640" height="360" fill="#0a0e14"/>

  <!-- Panel frame -->
  <rect x="48" y="48" width="544" height="264" rx="12" fill="#121821" stroke="#2a3444" stroke-width="2"/>

  <!-- Drum -->
  <ellipse cx="220" cy="160" rx="70" ry="48" fill="#3a4656"/>
  <ellipse cx="220" cy="160" rx="54" ry="34" fill="#1b2330" stroke="#8fa0b3" stroke-width="3"/>
  <text x="220" y="166" text-anchor="middle" fill="#c9d4e0" font-family="ui-monospace, monospace" font-size="12">DRUM</text>

  <!-- Motor -->
  <rect x="320" y="130" width="110" height="60" rx="8" fill="#2d6a5a"/>
  <text x="375" y="166" text-anchor="middle" fill="#d7f3ea" font-family="system-ui, sans-serif" font-size="14" font-weight="600">MOTOR</text>

  <!-- Shaft -->
  <rect x="290" y="152" width="30" height="16" fill="#9aa7b5"/>

  <!-- Rope path -->
  <path d="M220 208 v70" stroke="#d7dee8" stroke-width="4" fill="none"/>
  <circle cx="220" cy="286" r="10" fill="#e8b86a"/>

  <!-- Status lamps -->
  <circle cx="480" cy="110" r="12" fill="#8fd0c0"/>
  <text x="500" y="115" fill="#9fb0c3" font-family="system-ui, sans-serif" font-size="12">READY</text>
  <circle cx="480" cy="150" r="12" fill="#3a4553" stroke="#6a7788"/>
  <text x="500" y="155" fill="#6a7788" font-family="system-ui, sans-serif" font-size="12">FAULT</text>
  <circle cx="480" cy="190" r="12" fill="#3a4553" stroke="#6a7788"/>
  <text x="500" y="195" fill="#6a7788" font-family="system-ui, sans-serif" font-size="12">ESTOP</text>

  <text x="320" y="36" text-anchor="middle" fill="#9fb0c3" font-family="system-ui, sans-serif" font-size="14" letter-spacing="3">HOIST SCHEMATIC</text>
  <text x="48" y="340" fill="#6a7788" font-family="system-ui, sans-serif" font-size="11">Sample plant graphic - FEAT-HMI</text>
</svg>
