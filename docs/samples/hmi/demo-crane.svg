<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Demo gantry crane">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2330"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa7b5"/>
      <stop offset="100%" stop-color="#5b6775"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <rect x="0" y="300" width="640" height="60" fill="#12171f"/>
  <rect x="40" y="310" width="560" height="8" rx="2" fill="#3a4553"/>

  <!-- Legs -->
  <rect x="80" y="80" width="18" height="230" fill="url(#steel)"/>
  <rect x="542" y="80" width="18" height="230" fill="url(#steel)"/>
  <!-- Bridge -->
  <rect x="70" y="78" width="500" height="22" rx="3" fill="url(#steel)"/>
  <rect x="70" y="98" width="500" height="6" fill="#3d4654"/>

  <!-- Trolley -->
  <rect x="290" y="68" width="70" height="28" rx="4" fill="#c9d4e0"/>
  <circle cx="305" cy="98" r="7" fill="#2b3340"/>
  <circle cx="345" cy="98" r="7" fill="#2b3340"/>

  <!-- Rope + hook + load -->
  <line x1="325" y1="96" x2="325" y2="200" stroke="#d7dee8" stroke-width="3"/>
  <path d="M312 200 h26 l-6 14 h-14 z" fill="#e8b86a"/>
  <rect x="300" y="214" width="50" height="36" rx="3" fill="#6b8cae"/>
  <text x="325" y="237" text-anchor="middle" fill="#e8eef6" font-family="ui-monospace, monospace" font-size="11">LOAD</text>

  <text x="320" y="48" text-anchor="middle" fill="#9fb0c3" font-family="system-ui, sans-serif" font-size="14" letter-spacing="3">DEMO CRANE</text>
  <text x="40" y="340" fill="#6a7788" font-family="system-ui, sans-serif" font-size="11">Sample plant graphic - FEAT-HMI</text>
</svg>
