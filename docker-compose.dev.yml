name: tele-pendant-dev

services:
  modbus-sim:
    build:
      context: .
      dockerfile: Dockerfile.sim.dev
    container_name: tele-pendant-modbus-sim-dev
    ports:
      - "${MODBUS_SIM_PORT:-1502}:1502"
    environment:
      MODBUS_SIM_HOST: 0.0.0.0
      MODBUS_SIM_PORT: 1502
    develop:
      watch:
        - action: sync
          path: ./apps/modbus-sim/src
          target: /app/apps/modbus-sim/src
        - action: sync
          path: ./packages/modbus-core/src
          target: /app/packages/modbus-core/src
        - action: rebuild
          path: ./apps/modbus-sim/package.json
        - action: rebuild
          path: ./packages/modbus-core/package.json
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tele-pendant-api-dev
    env_file:
      - .env
    ports:
      - "${PORT:-3010}:${PORT:-3010}"
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3010}
      SQLITE_DIR: /app/data
      DATABASE_PATH: /app/data/tele-pendant.sqlite
      MODBUS_HOST: modbus-sim
      MODBUS_PORT: 1502
      APP_URL: ${APP_URL:-http://localhost:3010}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      # Named volume avoids Docker Desktop bind-mount mkdir failures under ~/Desktop
      - api_data:/app/data
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src
        - action: sync
          path: ./apps/api/ota
          target: /app/apps/api/ota
          ignore:
            - node_modules/
            - dist/
        - action: sync
          path: ./packages/shared/src
          target: /app/packages/shared/src
        - action: sync
          path: ./packages/modbus-core/src
          target: /app/packages/modbus-core/src
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
    depends_on:
      - modbus-sim
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    container_name: tele-pendant-web-dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_DEV_API_PROXY: http://api:3010
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/apps/web/src
        - action: sync
          path: ./apps/web/index.html
          target: /app/apps/web/index.html
        - action: sync
          path: ./apps/web/vite.config.ts
          target: /app/apps/web/vite.config.ts
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
