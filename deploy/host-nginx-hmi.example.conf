# Host (Ubuntu) nginx in front of Tele-Pendant Docker web/API.
# Copy the /socket.io/ and /api/ locations into the HMI server block
# (e.g. tele-pendant.jahbyte.com → 127.0.0.1:$WEB_PORT).
#
# Without Upgrade + long timeouts + proxy_buffering off, Socket.IO falls back
# to chunky long-polling and live height/trolley values stutter in production
# while local Docker (no host proxy) looks smooth.

# upstream examples — match PORT / WEB_PORT from server .env
# upstream tele_pendant_web { server 127.0.0.1:8080; }
# upstream tele_pendant_api { server 127.0.0.1:3010; }

server {
  server_name hmi.example.com;

  # Prefer proxying API + Socket.IO on the same origin as the SPA
  # (browser uses io('/realtime', { path: '/socket.io' })).

  location /api/ {
    proxy_pass http://127.0.0.1:3010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8m;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:3010/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
