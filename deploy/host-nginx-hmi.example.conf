# Host (Ubuntu) TLS nginx in front of Tele-Pendant Docker web.
# The web container already proxies /api/ and /socket.io/ to the API —
# host nginx only needs to terminate TLS and forward to WEB_PORT.

server {
  server_name hmi.example.com;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
