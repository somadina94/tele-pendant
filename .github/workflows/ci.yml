# =============================================================================
# CI/CD — build Tele-Pendant images on GitHub, deploy to VPS/EC2
# =============================================================================
#
# Triggers:
#   - pull_request → verify only
#   - push to main/master → verify → push-image → deploy
#
# Deploy model:
#   Build runs on GitHub runners. Host: git pull + ./deploy.sh (docker pull + up).
#
# Required GitHub secrets:
#   SERVER_HOST, SERVER_USERNAME, SERVER_PORT
#   Auth (either or both): SERVER_PASSWORD, SERVER_SSH_KEY
#   SERVER_DEPLOY_PATH (optional, default ~/tele-pendant)
# =============================================================================

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @tele-pendant/shared build
          pnpm --filter @tele-pendant/modbus-core build
          pnpm --filter @tele-pendant/plc-driver build
          pnpm --filter @tele-pendant/api build
          pnpm --filter @tele-pendant/web build

      - name: Test API
        run: pnpm --filter @tele-pendant/api test

      - name: Prepare compose env
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.dev.yml config
          docker compose -f docker-compose.prod.yml config
          docker compose config

      - name: Build production images
        run: |
          docker build --target api -t tele-pendant-api:test .
          docker build --target modbus-sim -t tele-pendant-sim:test .
          docker build --target web -t tele-pendant-web:test .

      - name: Ensure deploy scripts are executable
        run: chmod +x deploy.sh docker-entrypoint.sh && test -x deploy.sh

  push-image:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/tele-pendant-api:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/tele-pendant-api:${{ github.sha }}

      - name: Build and push sim image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: modbus-sim
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/tele-pendant-sim:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/tele-pendant-sim:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/tele-pendant-web:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/tele-pendant-web:${{ github.sha }}

  deploy:
    needs: push-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: tele-pendant-prod-deploy
      cancel-in-progress: false

    steps:
      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # appleboy/ssh-action downloads drone-ssh from GitHub Releases on every run;
      # that URL has been returning 504 / unreachable, so use OpenSSH instead.
      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
          GH_DEPLOY_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          GIT_REF: ${{ github.ref_name }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client
          PORT="${SERVER_PORT:-22}"
          SSH_BASE=(
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=30
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
            -p "$PORT"
          )
          if [ -n "${SERVER_SSH_KEY:-}" ]; then
            KEY_FILE="${RUNNER_TEMP}/deploy_key"
            printf '%s\n' "$SERVER_SSH_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            SSH=(ssh "${SSH_BASE[@]}" -o BatchMode=yes -i "$KEY_FILE" "${SERVER_USERNAME}@${SERVER_HOST}")
          else
            sudo apt-get install -y -qq sshpass
            SSH=(sshpass -e ssh "${SSH_BASE[@]}" "${SERVER_USERNAME}@${SERVER_HOST}")
          fi

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-$HOME/tele-pendant}"
          if [[ "$DEPLOY_PATH" != /* ]]; then
            DEPLOY_PATH="$HOME/$DEPLOY_PATH"
          fi
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "Deploy directory not found: $DEPLOY_PATH"
            exit 1
          fi
          cd "$DEPLOY_PATH"
          git fetch origin
          git checkout "$GIT_REF"
          git pull origin "$GIT_REF"
          chmod +x ./deploy.sh ./docker-entrypoint.sh
          echo "Logging in to ghcr.io for image pull..."
          echo "$GH_DEPLOY_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          export DEPLOY_BUILD_LOCAL=0
          export TELE_PENDANT_API_IMAGE="ghcr.io/${IMAGE_OWNER}/tele-pendant-api:latest"
          export TELE_PENDANT_SIM_IMAGE="ghcr.io/${IMAGE_OWNER}/tele-pendant-sim:latest"
          export TELE_PENDANT_WEB_IMAGE="ghcr.io/${IMAGE_OWNER}/tele-pendant-web:latest"
          # Host ports come from the server .env (PORT / WEB_PORT).
          rm -f /tmp/tele-pendant-deploy.lock
          ./deploy.sh
          REMOTE
          )

          for attempt in 1 2 3 4 5; do
            if printf '%s\n' "$REMOTE_SCRIPT" | "${SSH[@]}" \
              env \
              DEPLOY_PATH="${SERVER_DEPLOY_PATH:-}" \
              GIT_REF="$GIT_REF" \
              GH_DEPLOY_TOKEN="$GH_DEPLOY_TOKEN" \
              GH_ACTOR="$GH_ACTOR" \
              IMAGE_OWNER="$IMAGE_OWNER" \
              bash -s
            then
              echo "Deploy succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Deploy attempt ${attempt}/5 failed; retrying in 15s..."
            sleep 15
          done
          echo "Deploy failed after 5 attempts"
          exit 1
